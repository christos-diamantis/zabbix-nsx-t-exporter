zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 9a878bd3f23b47e09a4409359f406a99
      name: 'Templates/Network devices'
  templates:
    - uuid: 06086087126f4a948a15d37b78e317c6
      template: 'ADAPTERA - NSX-T by Prometheus exporter'
      name: 'ADAPTERA - NSX-T by Prometheus exporter'
      description: |
        VMware NSX-T 4.2 monitoring via the adaptera/zabbix-nsx-t-exporter (a fork of
        sapcc/nsx-t-exporter with extended collectors). The template scrapes the
        exporter's /metrics endpoint once per interval and fans the result out to
        dependent items and LLD rules.
        
        Covers the 9 operational scenarios:
          1. Manager cluster down/degraded
          2. Edge node down
          3. Transport node disconnected
          4. High CPU/Memory on Edge or Manager
          5. Geneve/TEP tunnel down
          6. BGP neighbor down
          7. IP/TEP pool exhaustion
          8. Certificate expiration
          9. Backup failure
        
        Plus Load Balancer service/VS/pool/member status and counters.
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 1bd0cf37addc4f33b6581330d472c6bd
          name: 'NSX-T: Cluster backup consecutive failures'
          type: DEPENDENT
          key: 'nsxt.backup.consecutive_failures[cluster]'
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'nsxv3_backup_consecutive_failures{type="cluster"}'
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 8a8d4ed99c5f4974a8d02125dc359e2e
              expression: 'last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.backup.consecutive_failures[cluster])>=2'
              name: 'NSX-T: Cluster backup has failed multiple times'
              opdata: 'Current failed consecutive backups: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 48dd3be8bced403d8c2f6cceb5737acf
          name: 'NSX-T: Inventory backup consecutive failures'
          type: DEPENDENT
          key: 'nsxt.backup.consecutive_failures[inventory]'
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'nsxv3_backup_consecutive_failures{type="inventory"}'
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
        - uuid: 9a0ef58abd254e19b981519096f36b7c
          name: 'NSX-T: Node backup consecutive failures'
          type: DEPENDENT
          key: 'nsxt.backup.consecutive_failures[node]'
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'nsxv3_backup_consecutive_failures{type="node"}'
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
        - uuid: 2a4559446ba2405ca07b6aaefae074be
          name: 'NSX-T: Cluster backup last attempt success'
          type: DEPENDENT
          key: 'nsxt.backup.last_attempt[cluster]'
          delay: '0'
          value_type: FLOAT
          description: '1=success, 0=failure, -1=no attempts recorded'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'nsxv3_backup_last_attempt_success{type="cluster"}'
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
        - uuid: 89cc124e8b074486bacd2e5b6ee1971f
          name: 'NSX-T: Cluster backup last success timestamp'
          type: DEPENDENT
          key: 'nsxt.backup.last_success[cluster]'
          delay: '0'
          value_type: FLOAT
          units: unixtime
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'nsxv3_backup_last_success_timestamp{type="cluster"}'
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 504df48aa426443c854b4ca27f5b3e93
              expression: '(now()-last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.backup.last_success[cluster]))>({$NSXT.BACKUP.STALE.HOURS}*3600)'
              name: 'NSX-T: Cluster backup has not succeeded'
              event_name: 'NSX-T: Cluster backup has not succeeded (more than {$NSXT.BACKUP.STALE.HOURS}h)'
              priority: HIGH
              description: 'Operational scenario #9: backup failure.'
              tags:
                - tag: scope
                  value: availability
        - uuid: a0a17cb4ddb14b9eaa23a2f2494d59c8
          name: 'NSX-T: Manager cluster control status'
          type: DEPENDENT
          key: nsxt.cluster.control.status
          delay: '0'
          value_type: FLOAT
          description: 'Control plane health - STABLE=1, NO_CONTROLLERS=0, UNSTABLE=-1, DEGRADED=-2, UNKNOWN=-3'
          valuemap:
            name: 'Cluster control status'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - nsxv3_cluster_control_status
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: c3a4346226bf4d0f85d51a75f3dd4d06
              expression: 'last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.cluster.control.status)<1'
              name: 'NSX-T: Manager control plane is degraded'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 6772ec3cdd1944b8a071bf7e47a82a60
          name: 'NSX-T: Manager cluster management status'
          type: DEPENDENT
          key: nsxt.cluster.management.status
          delay: '0'
          value_type: FLOAT
          description: 'STABLE=1, INITIALIZING=0, UNSTABLE=-1, DEGRADED=-2, UNKNOWN=-3'
          valuemap:
            name: 'Cluster mgmt status'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - nsxv3_cluster_management_status
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: b580a6abcb9d412589a4f91d9699a1d9
              expression: 'last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.cluster.management.status)<1'
              name: 'NSX-T: Manager cluster is degraded or down'
              opdata: 'Current state: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: 'NSX-T management cluster reports a state below STABLE. Operational scenario #1.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: d3ea9f644b6e480594e472c02ba117e8
          name: 'NSX-T: Manager cluster offline nodes'
          type: DEPENDENT
          key: nsxt.cluster.offline_nodes
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - nsxv3_cluster_management_offline_nodes
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: aeabdc7019464864be962ed477e1b008
              expression: 'last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.cluster.offline_nodes)>0'
              name: 'NSX-T: Manager cluster has offline node(s)'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
        - uuid: 85c021268d354c8ea5351d6115fe6a04
          name: 'NSX-T: Manager cluster online nodes'
          type: DEPENDENT
          key: nsxt.cluster.online_nodes
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - nsxv3_cluster_management_online_nodes
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
        - uuid: 6c70bfa706ae4959a92ad3a5a3011f89
          name: 'NSX-T: Last successful exporter fetch'
          type: DEPENDENT
          key: nsxt.exporter.last_fetch
          delay: '0'
          value_type: FLOAT
          units: unixtime
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - nsxv3_cluster_management_last_successful_data_fetch
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: 809476af73d44842abde752aaf81d83e
              expression: '(now()-last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.exporter.last_fetch))>{$NSXT.NO_FETCH.SECONDS}'
              name: 'NSX-T: Exporter is not collecting fresh data'
              event_name: 'NSX-T: Exporter is not collecting fresh data (exporter data are older than {$NSXT.NO_FETCH.SECONDS}s)'
              priority: AVERAGE
              description: 'The exporter has not successfully scraped NSX-T for {$NSXT.NO_FETCH.SECONDS}s. All other NSX-T alerts may be stale.'
              tags:
                - tag: scope
                  value: availability
        - uuid: 92e3f0d7bfc749cf9a08f8883f28bfb5
          name: 'NSX-T: Get metrics'
          type: HTTP_AGENT
          key: nsxt.get
          history: '0'
          value_type: TEXT
          trends: '0'
          authtype: BASIC
          username: '{$NSXT.EXPORTER.USER}'
          password: '{$NSXT.EXPORTER.PASSWORD}'
          description: 'Master item that scrapes the NSX-T Prometheus exporter. All other items derive from this.'
          timeout: 30s
          url: '{$NSXT.EXPORTER.URL}/metrics'
          tags:
            - tag: component
              value: raw
        - uuid: 86cc43d83e704606b62a3cda5d4151a2
          name: 'NSX-T: Transport nodes - degraded count'
          type: DEPENDENT
          key: nsxt.transport_nodes.degraded
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - nsxv3_transport_nodes_degraded
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
        - uuid: a4e814c42871416c8a7b7a0bf2cadd2f
          name: 'NSX-T: Transport nodes - down count'
          type: DEPENDENT
          key: nsxt.transport_nodes.down
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - nsxv3_transport_nodes_down
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
        - uuid: 2cb967c9486848108a3d3d11f4799796
          name: 'NSX-T: Transport nodes - up count'
          type: DEPENDENT
          key: nsxt.transport_nodes.up
          delay: '0'
          value_type: FLOAT
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - nsxv3_transport_nodes_up
                - value
                - ''
          master_item:
            key: nsxt.get
          tags:
            - tag: component
              value: system
      discovery_rules:
        - uuid: c1c6dee9ae5d4c38b5ae5cf6eac35e66
          name: 'NSX-T: BGP neighbors discovery'
          type: DEPENDENT
          key: nsxt.bgp_neighbors.discovery
          delay: '0'
          item_prototypes:
            - uuid: f47ed6ccdeb544efbb465122dae87976
              name: 'BGP [{#TIER0}]({#NEIGHBOR_IP}) (AS#{#REMOTE_AS}) on edge [{#EDGE_ID}]: Connection drops'
              type: DEPENDENT
              key: 'nsxt.bgp.drops[{#TIER0_ID},{#LS_ID},{#NEIGHBOR_IP},{#EDGE_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'Cumulative count of BGP session drops. Use Change to detect flapping over a window.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'nsxv3_bgp_neighbor_connection_drop_count{tier0_id="{#TIER0_ID}",locale_service_id="{#LS_ID}",neighbor_address="{#NEIGHBOR_IP}",edge_node_id="{#EDGE_ID}"}'
                    - value
                    - ''
              master_item:
                key: nsxt.get
              tags:
                - tag: bgp-neighbor-ip
                  value: '{#NEIGHBOR_IP}'
                - tag: bgp-remote-as
                  value: '{#REMOTE_AS}'
                - tag: bgp-tier0-gw
                  value: '{#TIER0}'
                - tag: component
                  value: bgp
              trigger_prototypes:
                - uuid: 06e98f4f2fa5461a85fd340a793cd24d
                  expression: '(max(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.bgp.drops[{#TIER0_ID},{#LS_ID},{#NEIGHBOR_IP},{#EDGE_ID}],10m) - min(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.bgp.drops[{#TIER0_ID},{#LS_ID},{#NEIGHBOR_IP},{#EDGE_ID}],10m)) >= 3'
                  name: 'NSX-T: BGP [{#TIER0}]({#NEIGHBOR_IP}) (AS#{#REMOTE_AS}) on edge [{#EDGE_ID}] is flapping'
                  priority: WARNING
                  description: '3+ session drops in the last 10 minutes indicates BGP flapping.'
                  dependencies:
                    - name: 'NSX-T: BGP [{#TIER0}]({#NEIGHBOR_IP}) (AS#{#REMOTE_AS}) on edge [{#EDGE_ID}] not ESTABLISHED'
                      expression: 'last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.bgp.status[{#TIER0_ID},{#LS_ID},{#NEIGHBOR_IP},{#EDGE_ID}])<1'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 4c9e540f012c482c87f5b68b440c5a71
              name: 'BGP [{#TIER0}]({#NEIGHBOR_IP}) (AS#{#REMOTE_AS}) on edge [{#EDGE_ID}]: Seconds since established'
              type: DEPENDENT
              key: 'nsxt.bgp.established_seconds[{#TIER0_ID},{#LS_ID},{#NEIGHBOR_IP},{#EDGE_ID}]'
              delay: '0'
              value_type: FLOAT
              units: s
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'nsxv3_bgp_neighbor_established_seconds{tier0_id="{#TIER0_ID}",locale_service_id="{#LS_ID}",neighbor_address="{#NEIGHBOR_IP}",edge_node_id="{#EDGE_ID}"}'
                    - value
                    - ''
              master_item:
                key: nsxt.get
              tags:
                - tag: bgp-neighbor-ip
                  value: '{#NEIGHBOR_IP}'
                - tag: bgp-remote-as
                  value: '{#REMOTE_AS}'
                - tag: bgp-tier0-gw
                  value: '{#TIER0}'
                - tag: component
                  value: bgp
            - uuid: 99ffbc8a1b84494693c22da1cee95dcf
              name: 'BGP [{#TIER0}]({#NEIGHBOR_IP}) (AS#{#REMOTE_AS}) on edge [{#EDGE_ID}]: Received prefixes'
              type: DEPENDENT
              key: 'nsxt.bgp.in_prefixes[{#TIER0_ID},{#LS_ID},{#NEIGHBOR_IP},{#EDGE_ID}]'
              delay: '0'
              value_type: FLOAT
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'nsxv3_bgp_neighbor_in_prefix_count{tier0_id="{#TIER0_ID}",locale_service_id="{#LS_ID}",neighbor_address="{#NEIGHBOR_IP}",edge_node_id="{#EDGE_ID}"}'
                    - value
                    - ''
              master_item:
                key: nsxt.get
              tags:
                - tag: bgp-neighbor-ip
                  value: '{#NEIGHBOR_IP}'
                - tag: bgp-remote-as
                  value: '{#REMOTE_AS}'
                - tag: bgp-tier0-gw
                  value: '{#TIER0}'
                - tag: component
                  value: bgp
            - uuid: a3209248b36d43a98b299f2d6bd4b74e
              name: 'BGP [{#TIER0}]({#NEIGHBOR_IP}) (AS#{#REMOTE_AS}) on edge [{#EDGE_ID}]: Status'
              type: DEPENDENT
              key: 'nsxt.bgp.status[{#TIER0_ID},{#LS_ID},{#NEIGHBOR_IP},{#EDGE_ID}]'
              delay: '0'
              value_type: FLOAT
              description: 'ESTABLISHED=1, OPEN_CONFIRM=0.8, OPEN_SENT=0.6, ACTIVE=0.4, CONNECT=0.2, IDLE=0, INVALID/UNKNOWN<0'
              valuemap:
                name: 'BGP status'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'nsxv3_bgp_neighbor_status{tier0_id="{#TIER0_ID}",locale_service_id="{#LS_ID}",neighbor_address="{#NEIGHBOR_IP}",edge_node_id="{#EDGE_ID}"}'
                    - value
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: nsxt.get
              tags:
                - tag: bgp-neighbor-ip
                  value: '{#NEIGHBOR_IP}'
                - tag: bgp-remote-as
                  value: '{#REMOTE_AS}'
                - tag: bgp-tier0-gw
                  value: '{#TIER0}'
                - tag: component
                  value: bgp
              trigger_prototypes:
                - uuid: de242abc866847778989590f2a39e154
                  expression: 'last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.bgp.status[{#TIER0_ID},{#LS_ID},{#NEIGHBOR_IP},{#EDGE_ID}])<1'
                  name: 'NSX-T: BGP [{#TIER0}]({#NEIGHBOR_IP}) (AS#{#REMOTE_AS}) on edge [{#EDGE_ID}] not ESTABLISHED'
                  opdata: 'Current state: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: 'Operational scenario #6: BGP neighbor down.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: nsxt.get
          lld_macro_paths:
            - lld_macro: '{#EDGE_ID}'
              path: $.labels.edge_node_id
            - lld_macro: '{#LS_ID}'
              path: $.labels.locale_service_id
            - lld_macro: '{#NEIGHBOR_IP}'
              path: $.labels.neighbor_address
            - lld_macro: '{#REMOTE_AS}'
              path: $.labels.remote_as
            - lld_macro: '{#TIER0_ID}'
              path: $.labels.tier0_id
            - lld_macro: '{#TIER0}'
              path: $.labels.tier0_name
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - nsxv3_bgp_neighbor_status
        - uuid: e5f415109683457f986133facc1041cf
          name: 'NSX-T: Certificates discovery'
          type: DEPENDENT
          key: nsxt.certificates.discovery
          delay: '0'
          item_prototypes:
            - uuid: 46f4f446c34a43d2b5430291b994a932
              name: 'Cert [{#CERT_NAME}]: Expiration date'
              type: DEPENDENT
              key: 'nsxt.cert.not_after[{#CERT_ID}]'
              delay: '0'
              value_type: FLOAT
              units: unixtime
              description: 'Absolute UNIX timestamp at which the certificate expires.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'nsxv3_certificate_not_after_timestamp{cert_id="{#CERT_ID}"}'
                    - value
                    - ''
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              master_item:
                key: nsxt.get
              tags:
                - tag: certificate-name
                  value: '{#CERT_NAME}'
                - tag: component
                  value: certificate
              trigger_prototypes:
                - uuid: 5051dc1c1cbc4d1c908c78c0b7986fc7
                  expression: '(last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.cert.not_after[{#CERT_ID}])-now())<({$NSXT.CERT.CRIT.DAYS}*86400)'
                  name: 'NSX-T: Certificate [{#CERT_NAME}] expires soon'
                  event_name: 'NSX-T: Certificate [{#CERT_NAME}] expires in less than {$NSXT.CERT.CRIT.DAYS} days'
                  priority: HIGH
                  description: 'Operational scenario #8: certificate expiration (critical).'
                  tags:
                    - tag: scope
                      value: notice
                - uuid: 34bbb03918c34c019bb8093397a8f09d
                  expression: '(last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.cert.not_after[{#CERT_ID}])-now())<({$NSXT.CERT.WARN.DAYS}*86400)'
                  name: 'NSX-T: Certificate [{#CERT_NAME}] expires soon'
                  event_name: 'NSX-T: Certificate [{#CERT_NAME}] expires in less than {$NSXT.CERT.WARN.DAYS} days'
                  priority: WARNING
                  dependencies:
                    - name: 'NSX-T: Certificate [{#CERT_NAME}] expires soon'
                      expression: '(last(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.cert.not_after[{#CERT_ID}])-now())<({$NSXT.CERT.CRIT.DAYS}*86400)'
                  tags:
                    - tag: scope
                      value: notice
          master_item:
            key: nsxt.get
          lld_macro_paths:
            - lld_macro: '{#CERT_ID}'
              path: $.labels.cert_id
            - lld_macro: '{#CERT_NAME}'
              path: $.labels.cert_name
            - lld_macro: '{#USED_BY}'
              path: $.labels.used_by
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - nsxv3_certificate_not_after_timestamp
        - uuid: 8fa1a95b7e8749d582d513a928aa848b
          name: 'NSX-T: Edge filesystems discovery'
          type: DEPENDENT
          key: nsxt.edge_filesystems.discovery
          delay: '0'
          item_prototypes:
            - uuid: 27faa6e2c8054d6fb99b28304cce841c
              name: 'Edge [{#NODE_NAME}]: FS [{#FS}]: Usage ratio'
              type: DEPENDENT
              key: 'nsxt.edge.fs.usage_ratio[{#NODE_ID},{#FS}]'
              delay: '0'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'nsxv3_edge_node_storage_usage_ratio{nsxv3_node_id="{#NODE_ID}",filesystem="{#FS}"}'
                    - value
                    - ''
                - type: MULTIPLIER
                  parameters:
                    - '100'
              master_item:
                key: nsxt.get
              tags:
                - tag: component
                  value: filesystem
                - tag: edge-node-name
                  value: '{#NODE_NAME}'
                - tag: filesystem
                  value: '{#FS}'
              trigger_prototypes:
                - uuid: 3a5465c8705343059d25eb6e81859d71
                  expression: 'min(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.edge.fs.usage_ratio[{#NODE_ID},{#FS}],5m)>{$NSXT.DISK.WARN}'
                  name: 'NSX-T: Edge [{#NODE_NAME}] FS [{#FS}]: High utilization'
                  event_name: 'NSX-T: Edge [{#NODE_NAME}] FS [{#FS}]: High utilization (more than {$NSXT.DISK.WARN}% for 5m)'
                  opdata: 'Current utilization: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  tags:
                    - tag: scope
                      value: capacity
                    - tag: scope
                      value: performance
          master_item:
            key: nsxt.get
          lld_macro_paths:
            - lld_macro: '{#FS}'
              path: $.labels.filesystem
            - lld_macro: '{#NODE_ID}'
              path: $.labels.nsxv3_node_id
            - lld_macro: '{#NODE_NAME}'
              path: $.labels.display_name
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - nsxv3_edge_node_storage_usage_ratio
        - uuid: cf1bf4fbec32417d9124a52f3a09136f
          name: 'NSX-T: Edge nodes discovery'
          type: DEPENDENT
          key: nsxt.edge_nodes.discovery
          delay: '0'
          item_prototypes:
            - uuid: 0ca4109db3194857aaa653a9fc9616e3
