              key: 'nsxt.mgr.memory_usage_ratio[{#NODE_IP}]'
              value_type: FLOAT
              units: '%'
              params: 'last(//nsxt.mgr.memory_use[{#NODE_IP}])/last(//nsxt.mgr.memory_total[{#NODE_IP}])*100'
              tags:
