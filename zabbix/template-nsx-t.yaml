                  expression: 'min(/ADAPTERA - NSX-T by Prometheus exporter/nsxt.mgr.memory_usage_ratio[{#NODE_IP}],5m)>{$NSXT.MEM.WARN}'
                  name: 'NSX-T: Manager [{#NODE_IP}]: Memory pressure is high'
                  event_name: 'NSX-T: Manager [{#NODE_IP}]: memory pressure is high (more than {$NSXT.MEM.WARN}% for 5m)'
                  opdata: 'Current utilization: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  tags:
                    - tag: scope
                      value: performance
